name: Publish Miniapp

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - config/**
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - project.config.json
      - deploy/make-miniapp-source-release.sh
      - deploy/upload-miniapp.sh
      - .github/workflows/publish-miniapp.yml
  workflow_dispatch:
    inputs:
      platform:
        description: Miniapp platform to publish
        required: true
        default: weapp
        type: choice
        options:
          - weapp
          - tt
          - alipay
      project_domain:
        description: API domain embedded into the miniapp build
        required: true
        default: https://car.shcxyz.site
        type: string

concurrency:
  group: recorouter-miniapp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WEAPP_UPLOAD_ON_MAIN == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      MINIAPP_PLATFORM: ${{ inputs.platform || vars.MINIAPP_PLATFORM || 'weapp' }}
      PROJECT_DOMAIN: ${{ inputs.project_domain || vars.PROJECT_DOMAIN || 'https://car.shcxyz.site' }}
      TARO_APP_WEAPP_APPID: ${{ vars.TARO_APP_WEAPP_APPID }}
    steps:
      - uses: actions/checkout@v4

      - name: Build miniapp source package
        run: deploy/make-miniapp-source-release.sh

      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          if [ -n "${SERVER_SSH_KEY:-}" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/recorouter_deploy_key
            chmod 600 ~/.ssh/recorouter_deploy_key
          elif [ -n "${SERVER_PASSWORD:-}" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          else
            echo "Set SERVER_SSH_KEY or SERVER_PASSWORD in GitHub Secrets." >&2
            exit 1
          fi

      - name: Upload miniapp from server
        run: |
          set -euo pipefail
          remote="$SERVER_USER@$SERVER_HOST"
          remote_cmd="TARO_APP_WEAPP_APPID='$TARO_APP_WEAPP_APPID' MINIAPP_PLATFORM='$MINIAPP_PLATFORM' PROJECT_DOMAIN='$PROJECT_DOMAIN' GITHUB_RUN_NUMBER='$GITHUB_RUN_NUMBER' bash /tmp/recorouter-miniapp-install/deploy/upload-miniapp.sh /tmp/recorouter-miniapp-source.tar.gz"
          if [ -n "${SERVER_SSH_KEY:-}" ]; then
            scp -O -P "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/recorouter_deploy_key /tmp/recorouter-miniapp-source.tar.gz "$remote:/tmp/recorouter-miniapp-source.tar.gz"
            ssh -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/recorouter_deploy_key "$remote" "mkdir -p /tmp/recorouter-miniapp-install && rm -rf /tmp/recorouter-miniapp-install/* && tar -xzf /tmp/recorouter-miniapp-source.tar.gz -C /tmp/recorouter-miniapp-install && $remote_cmd"
          else
            sshpass -p "$SERVER_PASSWORD" scp -O -P "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 /tmp/recorouter-miniapp-source.tar.gz "$remote:/tmp/recorouter-miniapp-source.tar.gz"
            sshpass -p "$SERVER_PASSWORD" ssh -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$remote" "mkdir -p /tmp/recorouter-miniapp-install && rm -rf /tmp/recorouter-miniapp-install/* && tar -xzf /tmp/recorouter-miniapp-source.tar.gz -C /tmp/recorouter-miniapp-install && $remote_cmd"
          fi
