name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - web-admin/**
      - config/**
      - patches/**
      - server/**
      - deploy/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - project.config.json
      - tsconfig.json
      - babel.config.js
      - eslint.config.mjs
      - .github/workflows/deploy-prod.yml
  workflow_dispatch:

concurrency:
  group: recorouter-production
  cancel-in-progress: false

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      PROJECT_DOMAIN: ${{ vars.PROJECT_DOMAIN || 'https://car.shcxyz.site' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        run: pnpm validate

      - name: Build web app
        run: PROJECT_DOMAIN="$PROJECT_DOMAIN" pnpm build:web

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build Rust API
        run: cargo build --manifest-path server/Cargo.toml --release --locked

      - name: Package web and backend release
        run: |
          set -euo pipefail
          out_dir=/tmp/recorouter-docker-release
          out_tar=/tmp/recorouter-docker-release.tar.gz
          rm -rf "$out_dir" "$out_tar"
          mkdir -p "$out_dir"
          cp server/target/release/recorouter-api "$out_dir/recorouter-api"
          cp -R server/migrations "$out_dir/migrations"
          cp -R dist-web "$out_dir/dist-web"
          cp -R deploy "$out_dir/deploy"
          tar -C "$out_dir" -czf "$out_tar" .
          ls -lh "$out_tar"

      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          if [ -n "${SERVER_SSH_KEY:-}" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/recorouter_deploy_key
            chmod 600 ~/.ssh/recorouter_deploy_key
          elif [ -n "${SERVER_PASSWORD:-}" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          else
            echo "Set SERVER_SSH_KEY or SERVER_PASSWORD in GitHub Secrets." >&2
            exit 1
          fi

      - name: Upload and install production release
        run: |
          set -euo pipefail
          remote="$SERVER_USER@$SERVER_HOST"
          upload_cmd='cat > /tmp/recorouter-docker-release.tar.gz.tmp && mv /tmp/recorouter-docker-release.tar.gz.tmp /tmp/recorouter-docker-release.tar.gz'
          install_cmd='mkdir -p /tmp/recorouter-install && rm -rf /tmp/recorouter-install/* && tar -xzf /tmp/recorouter-docker-release.tar.gz -C /tmp/recorouter-install && bash /tmp/recorouter-install/deploy/install-docker-release.sh /tmp/recorouter-docker-release.tar.gz'
          if [ -n "${SERVER_SSH_KEY:-}" ]; then
            ssh -T -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/recorouter_deploy_key "$remote" "$upload_cmd" < /tmp/recorouter-docker-release.tar.gz
            ssh -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/recorouter_deploy_key "$remote" "$install_cmd"
          else
            sshpass -p "$SERVER_PASSWORD" ssh -T -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$remote" "$upload_cmd" < /tmp/recorouter-docker-release.tar.gz
            sshpass -p "$SERVER_PASSWORD" ssh -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$remote" "$install_cmd"
          fi

      - name: Verify production API
        run: curl -fsS "$PROJECT_DOMAIN/api/health"
