name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - web-admin/**
      - config/**
      - patches/**
      - server/**
      - deploy/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - project.config.json
      - tsconfig.json
      - babel.config.js
      - eslint.config.mjs
      - .github/workflows/deploy-prod.yml
  workflow_dispatch:
    inputs:
      reuse_remote_release:
        description: Reuse the already uploaded release tar after an install-only failure
        required: false
        type: boolean
        default: false

concurrency:
  group: recorouter-production
  cancel-in-progress: false

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      PROJECT_DOMAIN: ${{ vars.PROJECT_DOMAIN || 'https://car.shcxyz.site' }}
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        if: ${{ !inputs.reuse_remote_release }}
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        if: ${{ !inputs.reuse_remote_release }}
        run: pnpm validate

      - name: Build web app
        if: ${{ !inputs.reuse_remote_release }}
        run: |
          PROJECT_DOMAIN="$PROJECT_DOMAIN" pnpm build:web
          PROJECT_DOMAIN="${PROJECT_DOMAIN%/}:18081" pnpm build:web:vehicle
          PROJECT_DOMAIN="${PROJECT_DOMAIN%/}:18082" pnpm build:web:mall

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.reuse_remote_release }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.reuse_remote_release }}
        with:
          workspaces: server

      - name: Build Rust APIs
        if: ${{ !inputs.reuse_remote_release }}
        run: cargo build --manifest-path server/Cargo.toml --release --locked --bins

      - name: Package web and backend release
        if: ${{ !inputs.reuse_remote_release }}
        run: |
          set -euo pipefail
          out_dir=/tmp/recorouter-docker-release
          out_tar=/tmp/recorouter-docker-release.tar.gz
          rm -rf "$out_dir" "$out_tar"
          mkdir -p "$out_dir"
          cp server/target/release/recorouter-api "$out_dir/recorouter-api"
          cp server/target/release/vehicle-api "$out_dir/vehicle-api"
          cp server/target/release/mall-api "$out_dir/mall-api"
          cp server/target/release/platform-api "$out_dir/platform-api"
          cp server/target/release/recorouter-migrator "$out_dir/recorouter-migrator"
          cp -R server/migrations "$out_dir/migrations"
          cp -R dist-web "$out_dir/dist-web"
          cp -R dist-web-vehicle "$out_dir/dist-web-vehicle"
          cp -R dist-web-mall "$out_dir/dist-web-mall"
          cp -R deploy "$out_dir/deploy"
          mkdir -p "$out_dir/mall-products"
          cp -R src/assets/mall-products/. "$out_dir/mall-products/"
          tar -C "$out_dir" -czf "$out_tar" .
          ls -lh "$out_tar"

      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          if [ -n "${SERVER_SSH_KEY:-}" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/recorouter_deploy_key
            chmod 600 ~/.ssh/recorouter_deploy_key
          elif [ -n "${SERVER_PASSWORD:-}" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          else
            echo "Set SERVER_SSH_KEY or SERVER_PASSWORD in GitHub Secrets." >&2
            exit 1
          fi

      - name: Upload and install production release
        env:
          REUSE_REMOTE_RELEASE: ${{ inputs.reuse_remote_release || false }}
        run: |
          set -euo pipefail
          remote="$SERVER_USER@$SERVER_HOST"
          upload_cmd='cat > /tmp/recorouter-docker-release.tar.gz.tmp && mv /tmp/recorouter-docker-release.tar.gz.tmp /tmp/recorouter-docker-release.tar.gz'
          install_cmd='set -euo pipefail; test -s /tmp/recorouter-docker-release.tar.gz; rm -rf /tmp/recorouter-installer; mkdir -p /tmp/recorouter-installer; tar -xzf /tmp/recorouter-docker-release.tar.gz -C /tmp/recorouter-installer ./deploy/install-docker-release.sh; bash /tmp/recorouter-installer/deploy/install-docker-release.sh /tmp/recorouter-docker-release.tar.gz; rm -f /tmp/recorouter-docker-release.tar.gz'
          read -r -d '' cleanup_cmd <<'EOF' || true
          set -euo pipefail
          rm -rf /tmp/recorouter-install /tmp/recorouter-installer
          rm -f /tmp/recorouter-docker-release.tar.gz.tmp
          current_release="$(readlink -f /opt/recorouter/current 2>/dev/null || true)"
          if [ -d /opt/recorouter/releases ]; then
            for release_dir in /opt/recorouter/releases/*; do
              [ -d "$release_dir" ] || continue
              if [ -n "$current_release" ] && [ "$(readlink -f "$release_dir")" = "$current_release" ]; then
                continue
              fi
              rm -rf "$release_dir"
            done
          fi
          docker container prune -f >/dev/null 2>&1 || true
          docker image prune -af >/dev/null 2>&1 || true
          docker builder prune -af --filter 'until=24h' >/dev/null 2>&1 || true
          df -h / /tmp /opt 2>/dev/null || true
          EOF
          if [ -n "${SERVER_SSH_KEY:-}" ]; then
            ssh -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/recorouter_deploy_key "$remote" "$cleanup_cmd"
            if [ "$REUSE_REMOTE_RELEASE" != "true" ]; then
              ssh -p "$SERVER_PORT" -i ~/.ssh/recorouter_deploy_key "$remote" 'rm -f /tmp/recorouter-docker-release.tar.gz'
              ssh -T -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/recorouter_deploy_key "$remote" "$upload_cmd" < /tmp/recorouter-docker-release.tar.gz
            fi
            ssh -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/recorouter_deploy_key "$remote" "$install_cmd"
          else
            sshpass -p "$SERVER_PASSWORD" ssh -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$remote" "$cleanup_cmd"
            if [ "$REUSE_REMOTE_RELEASE" != "true" ]; then
              sshpass -p "$SERVER_PASSWORD" ssh -p "$SERVER_PORT" "$remote" 'rm -f /tmp/recorouter-docker-release.tar.gz'
              sshpass -p "$SERVER_PASSWORD" ssh -T -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$remote" "$upload_cmd" < /tmp/recorouter-docker-release.tar.gz
            fi
            sshpass -p "$SERVER_PASSWORD" ssh -p "$SERVER_PORT" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$remote" "$install_cmd"
          fi

      - name: Verify production API
        run: curl -fsS "$PROJECT_DOMAIN/api/health"
